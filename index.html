<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Backrooms - Level 0 Accurate</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; touch-action: none; }
        #canvas { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 1; }
        
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111005; z-index: 200; display: flex;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        #start-btn {
            background: #c2b144; color: #000; font-weight: bold; font-size: 18px;
            padding: 15px 30px; border: none; border-radius: 5px; cursor: pointer;
            box-shadow: 0 0 15px rgba(194, 177, 68, 0.5); margin-top: 20px;
        }

        #jumpscare-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #050000; z-index: 100; display: none; justify-content: center; align-items: center;
        }
        #jumpscare-face {
            width: 320px; height: 320px; background: #110000; border-radius: 50%;
            box-shadow: 0 0 100px #ff0000; position: relative; animation: shake 0.03s infinite;
            border: 4px solid #ff0000;
        }
        .eye { position: absolute; width: 50px; height: 50px; background: #ffffff; border-radius: 50%; top: 70px; box-shadow: 0 0 30px #ffffff; }
        .eye.left { left: 60px; } .eye.right { right: 60px; }
        .pupil { width: 15px; height: 15px; background: #000; border-radius: 50%; position: absolute; top: 18px; left: 18px; }
        .mouth { position: absolute; width: 160px; height: 120px; background: #000; border-radius: 0 0 80px 80px; bottom: 30px; left: 80px; border: 4px solid #ff0000; }

        @keyframes shake {
            0% { transform: translate(10px, 10px) scale(1.2); }
            50% { transform: translate(-10px, -10px) scale(1.3); }
            100% { transform: translate(10px, -10px) scale(1.2); }
        }

        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .btn {
            position: absolute; background: rgba(0, 0, 0, 0.6); border: 2px solid #c2b144;
            color: #d8c85c; font-weight: bold; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation;
        }
        #btn-fwd { bottom: 120px; left: 45px; width: 70px; height: 70px; font-size: 24px; }
        #btn-back { bottom: 35px; left: 45px; width: 70px; height: 70px; font-size: 24px; }
        #btn-left { bottom: 45px; right: 105px; width: 70px; height: 70px; font-size: 24px; }
        #btn-right { bottom: 45px; right: 25px; width: 70px; height: 70px; font-size: 24px; }
        #btn-crouch { bottom: 120px; right: 65px; width: 70px; height: 70px; font-size: 11px; border-radius: 15px; border-color: #8b0000; color: #ff6666; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color: #c2b144; margin-bottom: 10px;">THE BACKROOMS</h1>
        <p style="color: #aaa;">Level 0 - Mono-Yellow</p>
        <button id="start-btn" onclick="startGame()">ENTRAR</button>
    </div>

    <div id="jumpscare-overlay">
        <div id="jumpscare-face">
            <div class="eye left"><div class="pupil"></div></div>
            <div class="eye right"><div class="pupil"></div></div>
            <div class="mouth"></div>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <div id="ui">
        <div class="btn" id="btn-fwd">▲</div>
        <div class="btn" id="btn-back">▼</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="btn" id="btn-crouch">⬇ Agachar</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        const MAP_SIZE = 32;
        const mainMap = [];
        for (let y = 0; y < MAP_SIZE; y++) {
            mainMap[y] = [];
            for (let x = 0; x < MAP_SIZE; x++) {
                if (x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1) mainMap[y][x] = 1;
                else mainMap[y][x] = (Math.random() < 0.20 && (x > 3 || y > 3)) ? 1 : 0;
            }
        }

        let player = { x: 2.5, y: 2.5, angle: 0, bobbing: 0, crouched: false };
        let monster = { x: 10.5, y: 10.5, active: true, speed: 0.035 };
        let keys = { fwd: false, back: false, left: false, right: false };

        let audioCtx = null, monsterGain = null, gameStarted = false, isDead = false;

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            audioCtx.resume();

            let humOsc = audioCtx.createOscillator();
            let humGain = audioCtx.createGain();
            humOsc.type = 'sawtooth'; humOsc.frequency.setValueAtTime(58, audioCtx.currentTime);
            humGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
            humOsc.connect(humGain); humGain.connect(audioCtx.destination);
            humOsc.start();

            let mOsc = audioCtx.createOscillator();
            monsterGain = audioCtx.createGain();
            mOsc.type = 'sawtooth'; mOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
            monsterGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            mOsc.connect(monsterGain); monsterGain.connect(audioCtx.destination);
            mOsc.start();

            gameStarted = true;
        }

        function playScream() {
            if (!audioCtx) return;
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.1);
            osc.frequency.exponentialRampToValueAtTime(250, audioCtx.currentTime + 0.6);
            
            gain.gain.setValueAtTime(1.0, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.7);

            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.7);
        }

        function triggerJumpscare() {
            if (isDead) return;
            isDead = true;
            playScream();
            
            const overlay = document.getElementById('jumpscare-overlay');
            overlay.style.display = 'flex';

            setTimeout(() => {
                overlay.style.display = 'none';
                player.x = 2.5; player.y = 2.5;
                monster.x = 12.5; monster.y = 12.5;
                isDead = false;
            }, 1000);
        }

        function bindBtn(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[key] = true; };
            const stop = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('touchstart', start); el.addEventListener('touchend', stop);
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', stop);
        }
        bindBtn('btn-fwd', 'fwd'); bindBtn('btn-back', 'back');
        bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');

        document.getElementById('btn-crouch').addEventListener('touchstart', (e) => { e.preventDefault(); player.crouched = !player.crouched; });
        document.getElementById('btn-crouch').addEventListener('mousedown', () => { player.crouched = !player.crouched; });

        function update() {
            if (!gameStarted || isDead) return;
            let moveSpeed = player.crouched ? 0.025 : 0.045;
            let rotSpeed = 0.045;

            if (keys.left) player.angle -= rotSpeed;
            if (keys.right) player.angle += rotSpeed;

            let dx = 0, dy = 0;
            if (keys.fwd) { dx += Math.cos(player.angle) * moveSpeed; dy += Math.sin(player.angle) * moveSpeed; }
            if (keys.back) { dx -= Math.cos(player.angle) * moveSpeed; dy -= Math.sin(player.angle) * moveSpeed; }

            let margin = 0.2;
            if (mainMap[Math.floor(player.y)][Math.floor(player.x + dx + Math.sign(dx)*margin)] === 0) player.x += dx;
            if (mainMap[Math.floor(player.y + dy + Math.sign(dy)*margin)][Math.floor(player.x)] === 0) player.y += dy;

            let mdx = player.x - monster.x; let mdy = player.y - monster.y;
            let dist = Math.sqrt(mdx * mdx + mdy * mdy);

            if (dist < 15) {
                monster.x += (mdx / dist) * monster.speed; monster.y += (mdy / dist) * monster.speed;
            }

            if (audioCtx) {
                let mVolume = Math.max(0, 1 - (dist / 8));
                monsterGain.gain.setValueAtTime(mVolume * 0.3, audioCtx.currentTime);
            }

            if (dist < 0.6) triggerJumpscare();
        }

        function render() {
            let halfH = canvas.height / 2;

            // Techo Beige/Amarillo Apagado
            ctx.fillStyle = '#6b6334'; 
            ctx.fillRect(0, 0, canvas.width, halfH);

            // Paneles Cuadrados de Luz
            let panelWidth = canvas.width / 6;
            for (let px = 0; px < 6; px++) {
                if (px % 2 === 0) {
                    ctx.fillStyle = '#fff9d6';
                    ctx.fillRect(px * panelWidth + 20, halfH * 0.2, panelWidth - 40, halfH * 0.25);
                }
            }

            // Suelo Alfombra Ocre
            ctx.fillStyle = '#7a6828'; 
            ctx.fillRect(0, halfH, canvas.width, halfH);

            if (!gameStarted) return;

            const fov = Math.PI / 3.2; const numRays = Math.floor(canvas.width / 3);
            const rayWidth = canvas.width / numRays;
            let zBuffer = [];

            for (let i = 0; i < numRays; i++) {
                let rayAngle = (player.angle - fov / 2) + (i / numRays) * fov;
                let distance = 0; let hit = 0;
                let cos = Math.cos(rayAngle); let sin = Math.sin(rayAngle);

                while (!hit && distance < 10) {
                    distance += 0.035;
                    let checkX = Math.floor(player.x + cos * distance); let checkY = Math.floor(player.y + sin * distance);
                    if (checkX < 0 || checkX >= MAP_SIZE || checkY < 0 || checkY >= MAP_SIZE || mainMap[checkY][checkX] > 0) hit = 1;
                }
                zBuffer[i] = distance;
                let correctedDist = distance * Math.cos(rayAngle - player.angle);
                let wallHeight = (canvas.height / (correctedDist + 0.05));
                let shadow = Math.max(0, 1 - (correctedDist / 8));

                // Paredes Amarillo Monótono (Estilo Level 0)
                let r = Math.floor(190 * shadow);
                let g = Math.floor(175 * shadow);
                let b = Math.floor(55 * shadow);

                let wallTop = (canvas.height - wallHeight) / 2;
                ctx.fillStyle = `rgb(${r},${g},${b})`;
                ctx.fillRect(i * rayWidth, wallTop, rayWidth + 1, wallHeight);

                // Zócalo/Moldura en la base
                ctx.fillStyle = `rgb(${Math.floor(110 * shadow)},${Math.floor(95 * shadow)},${Math.floor(30 * shadow)})`;
                ctx.fillRect(i * rayWidth, wallTop + wallHeight - (wallHeight * 0.05), rayWidth + 1, wallHeight * 0.05);
            }

            // Monstruo
            let mdx = monster.x - player.x; let mdy = monster.y - player.y;
            let mAngle = Math.atan2(mdy, mdx) - player.angle;
            while (mAngle < -Math.PI) mAngle += Math.PI * 2; while (mAngle > Math.PI) mAngle -= Math.PI * 2;
            let dist = Math.sqrt(mdx * mdx + mdy * mdy);

            if (dist > 0.1 && dist < 9 && Math.abs(mAngle) < fov) {
                let screenX = (canvas.width / 2) + Math.tan(mAngle) * (canvas.width / 2);
                let mSize = Math.min(canvas.height, (canvas.height / dist));
                let rayIdx = Math.floor(screenX / rayWidth);

                if (rayIdx >= 0 && rayIdx < numRays && dist < zBuffer[rayIdx]) {
                    ctx.fillStyle = `#000`;
                    ctx.fillRect(screenX - mSize/4, (canvas.height - mSize)/2, mSize/2, mSize);
                    ctx.fillStyle = `#ff0000`;
                    ctx.fillRect(screenX - mSize/8, (canvas.height - mSize)/2 + mSize/4, mSize/10, mSize/10);
                    ctx.fillRect(screenX + mSize/20, (canvas.height - mSize)/2 + mSize/4, mSize/10, mSize/10);
                }
            }
        }

        function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
