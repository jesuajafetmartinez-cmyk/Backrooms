<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Backrooms - Movie Edition</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: monospace; touch-action: none; }
        #canvas { width: 100vw; height: 100vh; display: block; position: absolute; top:0; left:0; z-index: 1; transition: filter 0.2s ease-out; }
        
        #jumpscare-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #000; z-index: 100; display: none; justify-content: center; align-items: center;
            flex-direction: column;
        }
        #jumpscare-face {
            width: 280px; height: 280px; background: #050505; border-radius: 50%;
            box-shadow: 0 0 50px #ff0000; position: relative; animation: shake 0.05s infinite;
        }
        .eye { position: absolute; width: 40px; height: 40px; background: #ff0000; border-radius: 50%; top: 70px; box-shadow: 0 0 20px #ff0000; }
        .eye.left { left: 60px; } .eye.right { right: 60px; }
        .mouth { position: absolute; width: 120px; height: 100px; background: #000; border-radius: 0 0 60px 60px; bottom: 40px; left: 80px; border: 3px solid #ff0000; }

        @keyframes shake {
            0% { transform: translate(5px, 5px) scale(1.1); }
            50% { transform: translate(-5px, -5px) scale(1.2); }
            100% { transform: translate(5px, -5px) scale(1.1); }
        }

        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; }
        .btn {
            position: absolute; background: rgba(0, 0, 0, 0.7); border: 2px solid #b3a032;
            color: #d4c359; font-weight: bold; border-radius: 50%; display: flex;
            align-items: center; justify-content: center; pointer-events: auto; touch-action: manipulation;
            box-shadow: 0 0 10px rgba(0,0,0,0.8);
        }
        .btn:active { background: rgba(179, 160, 50, 0.5); }

        #btn-fwd { bottom: 120px; left: 45px; width: 70px; height: 70px; font-size: 24px; }
        #btn-back { bottom: 35px; left: 45px; width: 70px; height: 70px; font-size: 24px; }
        #btn-left { bottom: 45px; right: 105px; width: 70px; height: 70px; font-size: 24px; }
        #btn-right { bottom: 45px; right: 25px; width: 70px; height: 70px; font-size: 24px; }
        #btn-crouch { bottom: 120px; right: 65px; width: 70px; height: 70px; font-size: 11px; border-radius: 15px; border-color: #8b0000; color: #ff6666; }

        #audio-btn {
            position: absolute; top: 15px; right: 15px; z-index: 20; background: #2e8b57;
            border: 1px solid #33ff66; color: white; padding: 10px 15px; border-radius: 5px;
            font-weight: bold; font-size: 13px; pointer-events: auto;
        }
        #warning { position: absolute; top: 20px; left: 20px; color: #d4c359; font-size: 11px; z-index: 20; pointer-events: none; text-shadow: 0 0 5px #000; }
    </style>
</head>
<body>

    <div id="jumpscare-overlay">
        <div id="jumpscare-face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
        </div>
    </div>

    <div id="warning">⚠ LEVEL 0: MAPA INMENSO<br>Encuentra una salida o evita ser atrapado.</div>
    <button id="audio-btn" onclick="initAudio()">🔊 Activar Audio</button>
    <canvas id="canvas"></canvas>

    <div id="ui">
        <div class="btn" id="btn-fwd">▲</div>
        <div class="btn" id="btn-back">▼</div>
        <div class="btn" id="btn-left">◀</div>
        <div class="btn" id="btn-right">▶</div>
        <div class="btn" id="btn-crouch">⬇ Agachar</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resize(); window.addEventListener('resize', resize);

        // Mapa 4 Veces Más Grande (32x32)
        const MAP_SIZE = 32;
        const mainMap = [];
        for (let y = 0; y < MAP_SIZE; y++) {
            mainMap[y] = [];
            for (let x = 0; x < MAP_SIZE; x++) {
                if (x === 0 || y === 0 || x === MAP_SIZE - 1 || y === MAP_SIZE - 1) mainMap[y][x] = 1;
                else mainMap[y][x] = (Math.random() < 0.22 && (x > 3 || y > 3)) ? 1 : 0;
            }
        }

        let player = { x: 2.5, y: 2.5, angle: 0, bobbing: 0, crouched: false };
        let monster = { x: 28.5, y: 28.5, active: true, speed: 0.028 };
        let keys = { fwd: false, back: false, left: false, right: false };

        // Audio
        let audioCtx = null, isAudioInit = false, monsterGain = null;

        function initAudio() {
            if (audioCtx) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            document.getElementById('audio-btn').style.background = '#2e8b57';
            isAudioInit = true;

            let humOsc = audioCtx.createOscillator();
            let humGain = audioCtx.createGain();
            humOsc.type = 'sawtooth'; humOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
            humGain.gain.setValueAtTime(0.015, audioCtx.currentTime);
            humOsc.connect(humGain); humGain.connect(audioCtx.destination);
            humOsc.start();

            let mOsc = audioCtx.createOscillator();
            monsterGain = audioCtx.createGain();
            mOsc.type = 'square'; mOsc.frequency.setValueAtTime(32, audioCtx.currentTime);
            monsterGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            mOsc.connect(monsterGain); monsterGain.connect(audioCtx.destination);
            mOsc.start();
        }

        function playScream() {
            if (!audioCtx) return;
            let screamOsc = audioCtx.createOscillator();
            let screamGain = audioCtx.createGain();
            screamOsc.type = 'sawtooth';
            screamOsc.frequency.setValueAtTime(300, audioCtx.currentTime);
            screamOsc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.4);
            screamGain.gain.setValueAtTime(0.8, audioCtx.currentTime);
            screamGain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
            screamOsc.connect(screamGain); screamGain.connect(audioCtx.destination);
            screamOsc.start(); screamOsc.stop(audioCtx.currentTime + 0.8);
        }

        function playStepSound() {
            if (!isAudioInit || !audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(50, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        }

        function bindBtn(id, key) {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); keys[key] = true; initAudio(); };
            const stop = (e) => { e.preventDefault(); keys[key] = false; };
            el.addEventListener('touchstart', start); el.addEventListener('touchend', stop);
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', stop);
        }
        bindBtn('btn-fwd', 'fwd'); bindBtn('btn-back', 'back');
        bindBtn('btn-left', 'left'); bindBtn('btn-right', 'right');

        document.getElementById('btn-crouch').addEventListener('touchstart', (e) => { e.preventDefault(); player.crouched = !player.crouched; initAudio(); });
        document.getElementById('btn-crouch').addEventListener('mousedown', () => { player.crouched = !player.crouched; initAudio(); });

        let isDead = false;
        function triggerJumpscare() {
            isDead = true;
            playScream();
            const overlay = document.getElementById('jumpscare-overlay');
            overlay.style.display = 'flex';
            setTimeout(() => {
                overlay.style.display = 'none';
                player.x = 2.5; player.y = 2.5;
                monster.x = 28.5; monster.y = 28.5;
                isDead = false;
            }, 1200);
        }

        function update() {
            if (isDead) return;
            let moveSpeed = player.crouched ? 0.022 : 0.042;
            let rotSpeed = 0.045;

            if (keys.left) player.angle -= rotSpeed;
            if (keys.right) player.angle += rotSpeed;

            let dx = 0, dy = 0;
            if (keys.fwd) { dx += Math.cos(player.angle) * moveSpeed; dy += Math.sin(player.angle) * moveSpeed; }
            if (keys.back) { dx -= Math.cos(player.angle) * moveSpeed; dy -= Math.sin(player.angle) * moveSpeed; }

            let margin = 0.22;
            if (mainMap[Math.floor(player.y)][Math.floor(player.x + dx + Math.sign(dx)*margin)] === 0) player.x += dx;
            if (mainMap[Math.floor(player.y + dy + Math.sign(dy)*margin)][Math.floor(player.x)] === 0) player.y += dy;

            if (monster.active && isAudioInit) {
                let mdx = player.x - monster.x; let mdy = player.y - monster.y;
                let dist = Math.sqrt(mdx * mdx + mdy * mdy);

                if (dist < 14) {
                    monster.x += (mdx / dist) * monster.speed; monster.y += (mdy / dist) * monster.speed;
                }

                let mVolume = Math.max(0, 1 - (dist / 10));
                monsterGain.gain.setValueAtTime(mVolume * 0.2, audioCtx.currentTime);

                if (dist < 4) {
                    let darkValue = 1 - (dist / 4);
                    canvas.style.filter = `contrast(${1 + darkValue * 1.5}) brightness(${1 - darkValue * 0.8}) blur(${darkValue * 4}px)`;
                } else { canvas.style.filter = 'contrast(1.1) brightness(0.9) blur(0px)'; }

                if (dist < 0.4 && !player.crouched) triggerJumpscare();
            }

            if (keys.fwd || keys.back) {
                player.bobbing += player.crouched ? 0.08 : 0.15;
                if (Math.floor(player.bobbing) % 3 === 0) playStepSound();
            } else { player.bobbing = 0; }
        }

        function render() {
            let crouchOffset = player.crouched ? canvas.height / 5 : 0;
            let bobOffset = Math.sin(player.bobbing) * (player.crouched ? 4 : 8);

            // Techo con focos
            ctx.fillStyle = '#11100a'; ctx.fillRect(0, 0, canvas.width, canvas.height / 2 + crouchOffset);
            
            // Focos de neón flotantes en el techo
            ctx.fillStyle = '#e6dfa8';
            ctx.fillRect(canvas.width * 0.2, 20 + bobOffset, canvas.width * 0.6, 6);

            // Suelo
            ctx.fillStyle = '#26210b'; ctx.fillRect(0, canvas.height / 2 + crouchOffset, canvas.width, canvas.height / 2 - crouchOffset);

            const fov = Math.PI / 3.2; const numRays = Math.floor(canvas.width / 3);
            const rayWidth = canvas.width / numRays;
            let zBuffer = [];

            for (let i = 0; i < numRays; i++) {
                let rayAngle = (player.angle - fov / 2) + (i / numRays) * fov;
                let distance = 0; let hit = 0;
                let cos = Math.cos(rayAngle); let sin = Math.sin(rayAngle);

                while (!hit && distance < 10) {
                    distance += 0.035;
                    let checkX = Math.floor(player.x + cos * distance); let checkY = Math.floor(player.y + sin * distance);
                    if (checkX < 0 || checkX >= MAP_SIZE || checkY < 0 || checkY >= MAP_SIZE || mainMap[checkY][checkX] > 0) hit = 1;
                }
                zBuffer[i] = distance;
                let correctedDist = distance * Math.cos(rayAngle - player.angle);
                let wallHeight = (canvas.height / (correctedDist + 0.05));
                let shadow = Math.max(0, 1 - (correctedDist / 8));

                // Textura estilo película
                let r = Math.floor(195 * shadow);
                let g = Math.floor(175 * shadow);
                let b = Math.floor(60 * shadow);

                ctx.fillStyle = `rgb(${r},${g},${b})`;
                let wallTop = (canvas.height - wallHeight) / 2 + bobOffset + crouchOffset;
                ctx.fillRect(i * rayWidth, wallTop, rayWidth + 1, wallHeight);

                // Patrón de papel tapiz vertical
                if (i % 3 === 0) {
                    ctx.fillStyle = `rgba(0,0,0,0.12)`;
                    ctx.fillRect(i * rayWidth, wallTop, rayWidth / 2, wallHeight);
                }
            }

            // Monstruo
            if (monster.active && isAudioInit && !isDead) {
                let mdx = monster.x - player.x; let mdy = monster.y - player.y;
                let mAngle = Math.atan2(mdy, mdx) - player.angle;
                while (mAngle < -Math.PI) mAngle += Math.PI * 2; while (mAngle > Math.PI) mAngle -= Math.PI * 2;
                let dist = Math.sqrt(mdx * mdx + mdy * mdy);

                if (dist > 0.1 && dist < 9 && Math.abs(mAngle) < fov) {
                    let screenX = (canvas.width / 2) + Math.tan(mAngle) * (canvas.width / 2);
                    let mSize = Math.min(canvas.height, (canvas.height / dist)) * 0.95;
                    let rayIdx = Math.floor(screenX / rayWidth);

                    if (rayIdx >= 0 && rayIdx < numRays && dist < zBuffer[rayIdx]) {
                        let mTop = (canvas.height - mSize) / 2 + bobOffset + crouchOffset;
                        let distShadow = Math.max(0, 1 - (dist / 8));

                        ctx.fillStyle = `rgba(5, 5, 5, ${distShadow * 1.5})`;
                        ctx.beginPath();
                        ctx.ellipse(screenX, mTop + mSize/2, mSize/4, mSize/2, 0, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = `rgb(255, 10, 10)`;
                        ctx.fillRect(screenX - mSize/10, mTop + mSize/3, mSize/12, mSize/12);
                        ctx.fillRect(screenX + mSize/25, mTop + mSize/3, mSize/12, mSize/12);
                    }
                }
            }
        }

        function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
        gameLoop();
    </script>
</body>
</html>
